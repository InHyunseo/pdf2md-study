[project]
name = "pdf2md-study"
version = "0.1.0"
description = "Convert papers and lecture slides (PDF) into study-ready Markdown for LLMs — equations and code kept as images, logos and references stripped."
readme = "README.md"
authors = [
    { name = "inhyunseo", email = "inhsroy@hanyang.ac.kr" }
]
requires-python = ">=3.10"
dependencies = [
    "docling>=2.133.0",
]

[project.scripts]
pdf2md-study = "pdf2md_study.cli:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
