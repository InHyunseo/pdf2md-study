[project]
name = "pdf2md-study"
version = "0.3.0"
description = "Convert papers and lecture slides (PDF) into study-ready Markdown for LLMs — equations and code kept as images, logos and references stripped."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "inhyunseo", email = "inhsroy@hanyang.ac.kr" }
]
requires-python = ">=3.10"
keywords = ["pdf", "markdown", "pdf-to-markdown", "docling", "llm", "study-tools", "lecture-notes"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "docling>=2.133.0",
    "docling-core>=2.99.0",
    "huggingface-hub>=1.33.0",
    "onnxruntime>=1.23.2",
    "tqdm>=4.70.1",
    "transformers>=5.18.0",
]

[project.urls]
Repository = "https://github.com/InHyunseo/pdf2md-study"
Documentation = "https://github.com/InHyunseo/pdf2md-study/blob/main/docs/usage.md"
Issues = "https://github.com/InHyunseo/pdf2md-study/issues"

[project.scripts]
pdf2md-study = "pdf2md_study.cli:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "docling-core>=2.99.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
